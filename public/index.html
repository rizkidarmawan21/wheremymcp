<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Owner controls for your WhereMyMCP gateway.">
  <title>WhereMyMCP · Owner workspace</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to workspace</a>
  <header class="masthead">
    <a class="wordmark" href="#overview"><span class="prefix">MCP /</span> WhereMyMCP</a>
    <div class="header-actions">
      <button id="menu-toggle" aria-controls="navigation" aria-expanded="false" hidden>Menu</button>
      <button id="theme-toggle" type="button">Dark theme</button>
      <button id="emergency-stop" class="danger" type="button" hidden>Stop gateway</button>
      <button id="logout" type="button" hidden>Log out</button>
    </div>
  </header>
  <div id="shell" class="shell">
    <nav id="navigation" aria-label="Owner workspace" hidden></nav>
    <main id="main" tabindex="-1" aria-busy="true">
      <p role="status">Checking owner session…</p>
    </main>
  </div>
  <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <noscript>This owner workspace requires JavaScript. Use the CLI for supported offline operations.</noscript>
</body>
</html>
