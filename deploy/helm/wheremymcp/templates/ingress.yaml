{{- if .Values.ingress.enabled }}
{{- if or (not .Values.publicMode) (not .Values.ingress.tlsSecret) }}{{ fail "Ingress requires publicMode and tlsSecret" }}{{ end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- end }}
  tls:
    - hosts: [{{ required "ingress.host required" .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecret | quote }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}
                port: {name: http}
{{- end }}
