services:
  upstream-fixture:
    image: wheremymcp:local
    entrypoint: [node, /app/tests/fixtures/mcp-server.mjs]
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./tests/fixtures/mcp-server.mjs:/app/tests/fixtures/mcp-server.mjs:ro
    mem_limit: 128m
    pids_limit: 64
    tmpfs: [/tmp]
    restart: "no"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/mcp').then(r=>process.exit(r.status===401?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      start_period: 1s
      retries: 3
